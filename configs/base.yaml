# Base configuration for AfriScience-MT experiments

# Project paths
paths:
  data_dir: ${oc.env:AFRISCIENCE_DATA_DIR,data}
  experiments_dir: ${oc.env:AFRISCIENCE_EXPERIMENTS_DIR,experiments}
  cache_dir: ${oc.env:HF_HOME,~/.cache/huggingface}
  output_dir: ${paths.experiments_dir}/${experiment.name}

# Experiment settings
experiment:
  name: default
  seed: 42
  device: auto  # auto, cuda, cpu
  precision: bf16  # fp32, fp16, bf16

# Languages
languages:
  source: eng
  targets:
    - amh
    - hau
    - lug
    - nso
    - yor
    - zul
  bidirectional: true

# Scientific domains
domains:
  - agriculture
  - biochemistry
  - biology
  - chemistry
  - computer_science
  - engineering
  - geography
  - health
  - indigenous_knowledge
  - sociology
  - statistics

# Data settings
data:
  train_split: train
  val_split: val
  test_split: test
  max_source_length: 256
  max_target_length: 256
  batch_size: 16
  num_workers: 4
  shuffle_train: true

# Evaluation settings
evaluation:
  metrics:
    - ssa_comet
    - bleu
    - chrf
  primary_metric: ssa_comet
  # SSA-COMET: Sub-Saharan African COMET from McGill-NLP
  # Specifically trained for African language evaluation
  ssa_comet_model: McGill-NLP/ssa-comet-stl
  # Standard COMET for comparison (optional)
  comet_model: Unbabel/wmt22-comet-da
  sacrebleu_tokenize: 13a
  denormalization:
    enabled: true
    languages:
      - yor
      - hau
      - nso

# Logging
logging:
  level: INFO
  log_to_file: true
  log_interval: 100
  eval_interval: 500

# Reproducibility
reproducibility:
  seed: ${experiment.seed}
  deterministic: true
  save_manifest: true
